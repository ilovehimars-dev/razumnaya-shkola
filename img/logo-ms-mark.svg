<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Clean architectural Eiffel Tower silhouette (simplified for razor-sharp legibility at 44-48px) -->
  <g fill="#2B4C7E">
    <!-- Spire & top crown -->
    <rect x="17.2" y="4" width="1.6" height="6.5" rx="0.8"/>
    <path d="M15.4 11.2h5.2l-0.6 2.3h-4z"/>
    <!-- Upper shaft -->
    <path d="M16.1 13.5h3.8l1.7 21.5h-7.2l1.7-21.5z" fill="none" stroke="#2B4C7E" stroke-width="2.1" stroke-linejoin="round"/>
    <!-- First deck -->
    <rect x="12.2" y="34.2" width="11.6" height="2.6" rx="0.8"/>
    <!-- Middle legs -->
    <path d="M13.5 36.8h9l3.3 10.6h-15.6l3.3-10.6z" fill="none" stroke="#2B4C7E" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Main deck -->
    <rect x="8.8" y="46.8" width="18.4" height="3" rx="0.9"/>
    <!-- Base legs + graceful arch -->
    <path d="M10.2 49.8h15.6l4 9.2h-4.6c-1.1-3.4-3.7-5.5-7.2-5.5s-6.1 2.1-7.2 5.5H6.2l4-9.2z"/>
  </g>

  <!-- Crisp calligraphic M in deep French navy (overlapping tower cleanly) -->
  <path d="M16.2 41.8 C19.5 44.5, 22.8 39.2, 26.8 28.5 L31.2 17.5 C32.3 14.8, 30.2 13.8, 24.5 16.5" stroke="#1B365D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31.0 17.6 C29.8 24.8, 27.6 33.4, 26.8 38.4 C26.4 40.9, 28.6 41.2, 31.2 37.0 L39.2 24.0 C41.6 20.1, 43.8 20.3, 42.9 25.0 L40.0 39.4 C39.4 42.6, 41.8 44.0, 44.8 41.8" stroke="#1B365D" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bold, high-contrast warm honey-gold calligraphic S -->
  <path d="M56.2 26.4 C57.2 21.8, 52.8 20.2, 49.6 23.0 C46.4 25.8, 46.8 30.8, 50.2 35.6 C53.4 40.2, 53.6 46.2, 49.4 49.6 C45.4 52.8, 39.8 51.6, 39.4 47.4 C39.1 44.6, 41.2 42.6, 43.2 42.4" stroke="#B67B12" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
